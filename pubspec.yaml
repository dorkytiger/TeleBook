name: tele_book
version: 3.1.4+4
publish_to: none
description: Simple way that download the telegraph Book.
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.1
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  background_downloader: ^9.5.4
  archive: ^4.0.7
  file_picker: ^10.3.8
  permission_handler: ^12.0.1
  riverpod: ^3.2.1
  go_router: ^17.2.1
  pdf: ^3.12.0
  pdfrx: ^2.4.3
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  forui: ^0.24.3
  webview_all: ^1.3.10
  flutter_image_compress: ^2.4.0

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.26.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  freezed: ^3.2.5

flutter:
  uses-material-design: true
