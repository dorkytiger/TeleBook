name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: 'TeleBook'
  FLUTTER_VERSION: '3.44.8'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from properties
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          echo "VERSION=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Version: v${VERSION_NAME} (${VERSION_CODE})"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Decode and setup signing keys
        run: |
          # 解码 keystore 文件（从 base64）
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          
          # 创建 key.properties 文件
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          
          echo "✅ Signing keys configured"

      - name: Update pubspec.yaml version
        run: dart run scripts/update_version.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Android APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7

  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from properties
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          echo "VERSION=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Version: v${VERSION_NAME} (${VERSION_CODE})"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Update pubspec.yaml version
        run: dart run scripts/update_version.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Create iOS Archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../${{ env.APP_NAME }}-ios-${{ steps.version.outputs.VERSION }}.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.APP_NAME }}-ios-${{ steps.version.outputs.VERSION }}.ipa
          retention-days: 7

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Read version from properties
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          echo "VERSION=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Version: v${VERSION_NAME} (${VERSION_CODE})"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.VERSION }}"; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.VERSION }} already exists"
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.VERSION }} does not exist"
          fi

      - name: Download Android APKs
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: ./artifacts

      - name: Download iOS IPA
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./artifacts

      - name: Rename APKs with version
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          mv artifacts/app-arm64-v8a-release.apk artifacts/${{ env.APP_NAME }}-android-arm64-${{ steps.version.outputs.VERSION }}.apk
          mv artifacts/app-armeabi-v7a-release.apk artifacts/${{ env.APP_NAME }}-android-arm32-${{ steps.version.outputs.VERSION }}.apk
          mv artifacts/app-x86_64-release.apk artifacts/${{ env.APP_NAME }}-android-x86_64-${{ steps.version.outputs.VERSION }}.apk

      - name: Create Release
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/${{ env.APP_NAME }}-android-arm64-${{ steps.version.outputs.VERSION }}.apk
            artifacts/${{ env.APP_NAME }}-android-arm32-${{ steps.version.outputs.VERSION }}.apk
            artifacts/${{ env.APP_NAME }}-android-x86_64-${{ steps.version.outputs.VERSION }}.apk
            artifacts/${{ env.APP_NAME }}-ios-${{ steps.version.outputs.VERSION }}.ipa
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎉 TeleBook ${{ steps.version.outputs.VERSION }}
            
            ### 📦 下载
            - **Android (arm64)**: [TeleBook-android-arm64-${{ steps.version.outputs.VERSION }}.apk]
            - **Android (arm32)**: [TeleBook-android-arm32-${{ steps.version.outputs.VERSION }}.apk]
            - **Android (x86_64)**: [TeleBook-android-x86_64-${{ steps.version.outputs.VERSION }}.apk]
            - **iOS**: [TeleBook-ios-${{ steps.version.outputs.VERSION }}.ipa]
            
            ### 📝 更新内容
            详见下方自动生成的更新日志。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release (tag exists)
        if: steps.check_tag.outputs.TAG_EXISTS == 'true'
        run: |
          echo "⚠️ Release v${{ steps.version.outputs.VERSION }} already exists, skipping..."

